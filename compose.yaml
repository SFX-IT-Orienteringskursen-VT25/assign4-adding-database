services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: addition-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - addition-sql-data:/var/opt/mssql
      - ./Database/init.sql:/scripts/init.sql:ro

volumes:
  addition-sql-data:
    name: addition-sql-data